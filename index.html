<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة الأصول الذكي</title>
    <!-- Add global error handler to show errors directly on screen for debugging -->
    <script>
      window.addEventListener('error', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.padding = '20px';
        errDiv.style.backgroundColor = 'red';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.innerHTML = '<h3>حدث خطأ غير متوقع:</h3><pre>' + e.message + '\\n' + (e.error && e.error.stack ? e.error.stack : '') + '</pre>';
        document.body.appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.padding = '20px';
        errDiv.style.backgroundColor = 'darkred';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.innerHTML = '<h3>Promise Error:</h3><pre>' + e.reason + '</pre>';
        document.body.appendChild(errDiv);
      });
    </script>

</html>
