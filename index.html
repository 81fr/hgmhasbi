<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>نظام إدارة الأصول الذكي</title>
    <!-- Global error handler with instant reload button -->
    <script>
      window.addEventListener('error', function(e) {
        if (!e.message) return;
        var msg = (e.message || '').toLowerCase();
        if (msg.includes('resizeobserver') || msg.includes('speech') || msg.includes('canceled') || msg.includes('script error')) return;
        var isChunkError = msg.includes('fetch') || msg.includes('dynamically imported') || msg.includes('loading chunk');
        if (!isChunkError) {
          console.error('App Error:', e);
          return;
        }
        if (document.getElementById('global-err-box')) return;
        var errDiv = document.createElement('div');
        errDiv.id = 'global-err-box';
        errDiv.style.position = 'fixed';
        errDiv.style.top = '15px';
        errDiv.style.right = '15px';
        errDiv.style.left = '15px';
        errDiv.style.padding = '18px 24px';
        errDiv.style.backgroundColor = '#00a59b';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.borderRadius = '14px';
        errDiv.style.boxShadow = '0 20px 40px rgba(0,0,0,0.5)';
        errDiv.style.fontFamily = 'system-ui, sans-serif';
        errDiv.style.direction = 'rtl';
        errDiv.innerHTML = '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
          '<div><strong style="font-size:1.1rem;">🔄 تم إصدار تحديث جديد للمنظومة:</strong><div style="font-size:0.85rem; margin-top:4px; opacity:0.9;">يرجى تحديث الصفحة لتحميل أحدث ملفات النظام.</div></div>' +
          '<div style="display:flex; gap:8px;">' +
            '<button onclick="window.location.reload(true)" style="background:#fff; color:#00a59b; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; cursor:pointer;">🔄 تحديث الصفحة الآن</button>' +
            '<button onclick="this.parentElement.parentElement.parentElement.remove()" style="background:rgba(255,255,255,0.2); color:#fff; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;">إغلاق</button>' +
          '</div></div>';
        document.body.appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.warn('Unhandled Promise Rejection:', e.reason);
      });
    </script>

  </head>

    <div id="root"></div>

</html>
